# @package _global_
# Configuration for unplug_charger task with transformer backbone using MASKED point clouds
defaults:
  - override /model: flow_so3  # Using regular flow model without attention loss
  - override /backbone: pointnet_transformer  # Clean transformer without attention head

# Task-specific configuration
env_config:
  task_name: unplug_charger

# Dataset configuration - using masked point cloud dataset
dataset:
  _target_: pfp.data.dataset_pcd_masked.RobotDatasetPcdMasked
  n_points: 256  # Reduced to match actual object points (~206)
  object_ids: [31, 34, 35, 92]  # Object IDs to keep (charger, socket, etc.)
  include_gripper: True  # Include points near gripper
  gripper_radius: 0.05  # Radius around gripper
  min_points: 50  # Reduced minimum points required
  
# Transformer hyperparameters - optimized for memory
backbone:
  hidden_dim: 256  # Reduced from 384
  num_heads: 4
  num_layers: 1    # Reduced from 6 for faster training
  dropout: 0.2
  positional_encoding: learned
  use_gradient_checkpointing: True  # Save memory

obs_features_dim: 256 

# Memory optimization  
dataloader:
  batch_size: 128  # Balanced for memory and speed
  
# Training adjustments
trainer:
  gradient_accumulation_steps: 8  # This gives effective batch_size=64 and ~160 steps/epoch

# WandB configuration
wandb:
  name: "transformer_masked_pointcloud_256pts_1layers"
  tags: ["transformer", "masked_pointcloud", "unplug_charger", "256_points"]